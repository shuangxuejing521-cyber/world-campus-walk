<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界校园漫游</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a full-window 3D stage; one quiet panel on the left lists campuses, small controls sit at the edges. One night-sky world by choice, so a single theme. */
:root{
  color-scheme: dark;
  --space:#0c1a26;
  --panel:#12232f;
  --line:#2b4354;
  --ink:#eef3f1;
  --muted:#9db0b8;
  --gold:#f2b632;
  --teal:#49c5b6;
  --font-display:"Noto Serif SC","Noto Sans KR",Georgia,serif;
  --font-body:"Noto Sans SC","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--space);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:700;padding:2px 7px;border-radius:3px;background:rgba(12,26,38,.82);color:var(--ink);will-change:transform}
.lab.open{background:var(--gold);color:#201600}
.lab.sel{background:var(--teal);color:#06211d}
.lab.b{background:rgba(255,255,255,.9);color:#1b2a33}

header{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:12px 16px;pointer-events:none;flex-wrap:wrap}
header>*{pointer-events:auto}
h1{font-family:var(--font-display);font-size:20px;margin:0;letter-spacing:.02em;text-wrap:balance;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.ttl{display:flex;flex-direction:column;gap:2px}
#tag{font-size:13px;color:var(--gold);font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6)}
body.campus #tag{display:none}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#10202b;font-weight:700}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;font-size:13px;color:var(--ink)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#201600;font-weight:700}

#panel{position:absolute;left:16px;top:84px;width:310px;max-height:calc(100% - 96px);overflow:auto;background:rgba(18,35,47,.94);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
#panel p{margin:0;color:var(--muted);font-size:13px}
#panel h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
#count{font-size:12px;color:var(--muted)}
#uniFilter{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--space);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li.reg{font-size:11px;letter-spacing:.08em;color:var(--teal);font-weight:700;padding:8px 2px 0}
li.uni{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
li.uni.open{border-color:var(--gold)}
li.uni.sel{border-color:var(--teal)}
li.uni button.n{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
li.uni .n b{display:block;font-size:14px}
li.uni .n span{font-size:12px;color:var(--muted)}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--teal);color:var(--teal);background:none;white-space:nowrap}
.spec{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.spec li{font-size:13px;color:var(--muted);padding-left:14px;position:relative}
.spec li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--teal)}
#founder{border-top:1px solid var(--line);padding-top:12px;font-size:12px}
#founder b{color:var(--ink)}
#founder a{color:var(--teal)}

#hud{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:flex-end;gap:12px;pointer-events:none}
#hud>*{pointer-events:auto}
#hint{background:rgba(18,35,47,.9);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;max-width:480px}
#near{font-weight:700;color:var(--gold)}
#by{color:var(--muted);font-size:12px}
#stick{width:112px;height:112px;border-radius:50%;border:1px solid var(--line);background:rgba(18,35,47,.7);position:relative;touch-action:none;flex:none}
#knob{position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:var(--ink);opacity:.85}
#credit{position:absolute;right:16px;bottom:16px;font-size:11px;color:var(--muted);text-align:right;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6);max-width:46%}
body.campus #credit{bottom:auto;top:60px}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#10202b;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;display:none;max-width:calc(100% - 32px)}
#err{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:10px;display:none;max-width:320px}
#dlgWrap{position:absolute;inset:0;background:rgba(6,14,20,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
#dlg h2{font-family:var(--font-display);font-size:18px;margin:0;text-wrap:balance}
#dlg .who{color:var(--gold);font-weight:700}
#dlg ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:14px}
#dlg .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#dlg a.btn{text-decoration:none}
[hidden]{display:none!important}
@media (max-width:640px){
  #panel{left:16px;right:16px;width:auto;top:auto;bottom:16px;max-height:46%}
  body.globe #credit{display:none}
  h1{font-size:17px}
  #hint{font-size:12px}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
#follow{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:10px;background:rgba(20,26,32,.82);color:#fff;padding:7px 8px 7px 14px;border-radius:999px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#follow[hidden]{display:none}
#follow .dot{width:10px;height:10px;border-radius:50%;background:#ff7a1a;box-shadow:0 0 0 3px rgba(255,122,26,.3)}
#follow button{border:0;border-radius:999px;background:#fff;color:#1b232b;font:inherit;font-size:13px;padding:5px 12px;cursor:pointer}
</style>
</head>
<body class="globe">
<canvas id="stage" aria-label="3D"></canvas>
<div id="labels"></div>

<header>
  <button class="btn" id="back" hidden data-t="back" type="button"></button>
  <div class="ttl"><h1 id="title"></h1><div id="tag" data-t="tag"></div></div>
  <div class="spacer"></div>
  <div class="seg" id="modeSeg" hidden role="group">
    <button id="mWalk" type="button" aria-pressed="true" data-t="walk"></button>
    <button id="mAir" type="button" aria-pressed="false" data-t="air"></button>
  </div>
  <div class="seg" id="langSeg" role="group" aria-label="Language">
    <button type="button" data-l="zh">中文</button><button type="button" data-l="ko">한국어</button><button type="button" data-l="en">EN</button>
  </div>
</header>

<aside id="panel">
  <p data-t="intro"></p>
  <h2 data-t="campuses"></h2>
  <div id="count"></div>
  <input id="uniFilter" type="search" autocomplete="off">
  <ul id="uniList"></ul>
  <div class="spec">
    <h2 data-t="joinH"></h2>
    <ul>
      <li data-t="join1"></li>
      <li data-t="join2"></li>
      <li data-t="join3"></li>
    </ul>
  </div>
  <p id="founder"></p>
</aside>

<div id="hud" hidden>
  <div id="stick" aria-hidden="true"><div id="knob"></div></div>
  <div id="hint"><div id="near"></div><div id="hintText"></div><div id="by"></div></div>
</div>
<div id="follow" hidden><span class="dot"></span><span id="followTxt"></span><button type="button" id="followX" data-t="stopF"></button></div>
<div id="credit" data-t="credit"></div>
<div id="toast" role="status"></div>
<div id="err" data-t="err"></div>
<div id="dlgWrap" hidden>
  <div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgH">
    <h2 id="dlgH" data-t="claimH"></h2>
    <div class="who" id="dlgWho"></div>
    <ol><li data-t="claim1"></li><li data-t="claim2"></li><li data-t="claim3"></li></ol>
    <div class="row"><a class="btn primary" id="dlgRepo" target="_blank" rel="noopener" data-t="repoBtn"></a><button class="btn" id="dlgClose" type="button" data-t="close"></button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

      cCam.position.set(me.x,1.7,me.z);cCam.rotation.set(-me.pitch,-me.yaw,0,"YXZ");
      fx=me.x+Math.sin(me.yaw)*50;fz=me.z-Math.cos(me.yaw)*50;H=110;fogN=140;fogF=750;
    }else{
      let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-stick.y,s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+stick.x;
      const sp=air.dist*0.9*dt,ux=-Math.sin(air.az),uz=-Math.cos(air.az);
      air.tx=Math.max(-C.lim,Math.min(C.lim,air.tx+(ux*f-uz*s)*sp));air.tz=Math.max(-C.lim,Math.min(C.lim,air.tz+(uz*f+ux*s)*sp));
      cCam.position.set(air.tx+air.dist*Math.cos(air.el)*Math.sin(air.az),air.dist*Math.sin(air.el),air.tz+air.dist*Math.cos(air.el)*Math.cos(air.az));cCam.rotation.order="XYZ";cCam.lookAt(air.tx,0,air.tz);
      fx=air.tx;fz=air.tz;H=Math.max(120,Math.min(560,air.dist*0.8));fogN=air.dist*0.9;fogF=air.dist*3+500;
    }
    if(cur.marker)cur.marker.g.visible=false}
  cCam.updateMatrixWorld();
  cur.S.fog.near=fogN;cur.S.fog.far=fogF;
  cur.sky.position.copy(cCam.position);
  const sun=cur.sun,sc=sun.shadow.camera;
  if(Math.abs(H-shadowH)>1){shadowH=H;sc.left=-H;sc.right=H;sc.top=H;sc.bottom=-H;sc.updateProjectionMatrix()}
  const tex=2*H/sun.shadow.mapSize.x;fx=Math.round(fx/tex)*tex;fz=Math.round(fz/tex)*tex;
  sun.target.position.set(fx,0,fz);sun.position.set(fx+cur.sunDir.x*500,cur.sunDir.y*500,fz+cur.sunDir.z*500);sun.target.updateMatrixWorld();
  if(mode==="walk"&&!follow){
    const near=cur.labs.map(l=>({l,d:Math.hypot(l.b.cx-me.x,l.b.cz-me.z)})).filter(o=>o.d<140).sort((a,b)=>a.d-b.d).slice(0,10);
    const on=new Set(near.map(o=>o.l));cur.labs.forEach(l=>place(l.el,l.v,cCam,on.has(l)));
    if(now-nearT>400){nearT=now;const o=near[0];$("near").textContent=o&&o.d<110?t("near")+bname(o.l.b)+" · "+Math.round(o.d)+" m":""}
  }else{cur.labs.forEach(l=>place(l.el,l.v,cCam,!follow&&!!l.big));if(now-nearT>400){nearT=now;$("near").textContent=""}}
  renderer.render(cur.S,cCam);
}

/* ---------- state + input ---------- */
const me={x:0,z:0,yaw:0,pitch:0};
const air={az:0.9,el:0.75,dist:420,tx:0,tz:0};
const keys={};const stick={x:0,y:0};
addEventListener("keydown",e=>{if(e.target&&e.target.tagName==="INPUT")return;keys[e.code]=true;if(view==="campus"&&/^Arrow/.test(e.code))e.preventDefault()});
addEventListener("keyup",e=>{keys[e.code]=false});
addEventListener("blur",()=>{for(const k in keys)keys[k]=false});
const ptr=new Map();let moved=0,pinch=0;
canvas.addEventListener("pointerdown",e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;spin=false;tgt=null;try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  if(ptr.size===2){const a=[...ptr.values()];pinch=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}});
canvas.addEventListener("pointermove",e=>{const p=ptr.get(e.pointerId);if(!p||!renderer)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptr.size===2){const a=[...ptr.values()];const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pinch&&d)zoom(pinch/d);pinch=d;return}
  if(view==="globe"){const k=0.005*(gCam.position.z-1)/2.3;globe.rotation.y+=dx*k;globe.rotation.x=Math.max(-1.2,Math.min(1.2,globe.rotation.x+dy*k))}
  else if(follow){fol.az-=dx*0.006;fol.el=Math.max(0.05,Math.min(1.4,fol.el+dy*0.005));fol.drag=2.5}
  else if(mode==="walk"){me.yaw+=dx*0.004;me.pitch=Math.max(-1.2,Math.min(1.2,me.pitch+dy*0.004))}
  else{air.az-=dx*0.005;air.el=Math.max(0.15,Math.min(1.5,air.el+dy*0.005))}});
function up(e){const had=ptr.delete(e.pointerId);pinch=0;if(had&&moved<6){if(view==="globe")pick(e);else if(view==="campus"&&!pickAgent(e))stopFollow()}}
canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",e=>{ptr.delete(e.pointerId);pinch=0});
canvas.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY>0?1.1:0.9)},{passive:false});
function zoom(f){if(!renderer)return;if(view==="campus"&&follow){fol.dist=Math.max(3,Math.min(90,fol.dist*f));return}if(view==="globe")gCam.position.z=Math.max(1.3,Math.min(6,gCam.position.z*f));else if(mode==="air"&&cur)air.dist=Math.max(60,Math.min(cur.C.ext*3,air.dist*f))}
const ray=renderer?new THREE.Raycaster():null,nd=renderer?new THREE.Vector2():null;
const v3=renderer?new THREE.Vector3():null,camDir=renderer?new THREE.Vector3():null;
function pick(e){const r=canvas.getBoundingClientRect();nd.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(nd,gCam);
  globe.updateMatrixWorld();let best=null,bd=0.012+0.03*(gCam.position.z-1)/2.3;
  UNIS.forEach(u=>{v3.copy(u.pos).applyMatrix4(globe.matrixWorld);if(v3.dot(camDir.copy(gCam.position).sub(v3))<=0)return;const d=ray.ray.distanceToPoint(v3)-(u.open?0.004:0);if(d<bd){bd=d;best=u}});
  if(!best)return;if(best.open)go(best.id);else{sel=best;renderList();openClaim(best)}}
(function(){const s=$("stick"),k=$("knob");let id=null;
  function set(e){const r=s.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}stick.x=x;stick.y=y;k.style.transform="translate("+x*36+"px,"+y*36+"px)"}
  s.addEventListener("pointerdown",e=>{id=e.pointerId;try{s.setPointerCapture(id)}catch(_){}set(e)});
  s.addEventListener("pointermove",e=>{if(e.pointerId===id)set(e)});
  const end=e=>{if(e.pointerId!==id)return;id=null;stick.x=stick.y=0;k.style.transform=""};
  s.addEventListener("pointerup",end);s.addEventListener("pointercancel",end)})();

/* ---------- views ---------- */
function setView(v,id){
  stopFollow();
  if(cur)cur.labs.forEach(l=>l.el.style.display="none");
  if(v==="campus"&&renderer){if(!built[id])built[id]=buildCampus(id);cur=built[id];
    me.x=cur.start.x;me.z=cur.start.z;me.yaw=cur.start.yaw;me.pitch=0;air.dist=380;air.az=0.9;air.el=0.62;air.tx=0;air.tz=0;
    cur.labs.forEach(l=>l.el.style.display="")}
  else{v="globe";cur=null}
  view=v;document.body.className=v;
  $("panel").hidden=v!=="globe";$("back").hidden=v!=="campus";$("modeSeg").hidden=v!=="campus";$("hud").hidden=v!=="campus";
  if(renderer)UNIS.forEach(u=>u.el.style.display=v==="globe"?"":"none");
  applyText();
  if(v==="campus"&&id!=="hufs")setTimeout(()=>{if(cur&&cur.C.id===id)toast(t("improve"))},1200);
}
function setMode(m){if(follow&&m!==mode)stopFollow();mode=m;$("mWalk").setAttribute("aria-pressed",String(m==="walk"));$("mAir").setAttribute("aria-pressed",String(m==="air"));$("stick").style.display=coarse?"":"none";applyText()}
function readHash(){const h=(location.hash||"").slice(1);return CD[h]?h:null}
function go(id){try{location.hash=id||"globe"}catch(e){}const c=id&&CD[id]?id:null;setView(c?"campus":"globe",c)}
addEventListener("hashchange",()=>{const h=readHash();if((h||null)!==(cur?cur.C.id:null))setView(h?"campus":"globe",h)});
$("back").onclick=()=>go(null);$("followX").onclick=()=>stopFollow();$("mWalk").onclick=()=>setMode("walk");$("mAir").onclick=()=>setMode("air");
document.querySelectorAll("#langSeg button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("wcw-lang",lang)}catch(e){}applyText()});

let claimU=null;
function claimUrl(){return SITE.repo?SITE.repo+"/issues/new?template=claim-campus.yml":""}
function openClaim(u){claimU=u;sel=u;$("dlgWho").textContent=u[lang][0]+" · "+u[lang][1];$("dlgWrap").hidden=false;$("dlgRepo").href=claimUrl();$("dlgRepo").hidden=!SITE.repo;$("dlgClose").focus()}
function closeClaim(){$("dlgWrap").hidden=true;claimU=null}
$("dlgClose").onclick=closeClaim;$("dlgWrap").addEventListener("click",e=>{if(e.target===$("dlgWrap"))closeClaim()});
addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("dlgWrap").hidden)closeClaim();else stopFollow()}});

function renderList(){
  const q=($("uniFilter").value||"").trim().toLowerCase(),ul=$("uniList");ul.textContent="";let shown=0;
  Object.keys(REG).forEach(rg=>{
    const items=UNIS.filter(u=>u.reg===rg&&(!q||[u.zh,u.ko,u.en].some(a=>(a[0]+" "+a[1]).toLowerCase().indexOf(q)>=0)));if(!items.length)return;
    items.sort((a,b)=>(b.open?1:0)-(a.open?1:0));
    const hd=document.createElement("li");hd.className="reg";hd.textContent=REG[rg][li(lang)]+" · "+items.length;ul.appendChild(hd);
    items.forEach(u=>{shown++;const l=document.createElement("li");l.className="uni"+(u.open?" open":"")+(u===sel?" sel":"");
      const n=document.createElement("button");n.className="n";n.type="button";const b=document.createElement("b");b.textContent=u[lang][0];const s=document.createElement("span");s.textContent=u[lang][1];n.appendChild(b);n.appendChild(s);n.onclick=()=>focusUni(u);l.appendChild(n);
      const bt=document.createElement("button");bt.type="button";
      if(u.open){bt.className="btn primary";bt.textContent=t("enter");bt.onclick=()=>go(u.id)}
      else{bt.className="pill";bt.textContent=t("claim");bt.onclick=()=>openClaim(u)}
      l.appendChild(bt);ul.appendChild(l)})});
  if(!shown){const l=document.createElement("li");l.className="reg";l.textContent=t("none");ul.appendChild(l)}
  $("count").textContent=t("count").replace("{n}",UNIS.length).replace("{o}",UNIS.filter(u=>u.open).length);
}
$("uniFilter").addEventListener("input",renderList);

function applyText(){
  document.documentElement.lang=lang==="zh"?"zh":lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("#langSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===lang)));
  const cu=cur?uniById(cur.C.id):null;
  $("title").textContent=cu?cu[lang][0]:t("title");
  $("hintText").textContent=mode==="air"?t(coarse?"hintAirTouch":"hintAir"):(coarse?t("hintTouch"):t("hintWalk"));
  $("by").textContent=cu&&cu.id!=="hufs"?t("byOsm"):"";
  $("uniFilter").placeholder=t("find");$("uniFilter").setAttribute("aria-label",t("find"));
  if(renderer)UNIS.forEach(u=>u.el.textContent=u[lang][0]);
  renderList();
  const fo=$("founder");fo.textContent="";const fb=document.createElement("b");fb.textContent=t("founder")+": "+SITE.founder;fo.appendChild(fb);
  fo.appendChild(document.createTextNode(" · 2026 · "+t("indep")+" "));
  if(SITE.repo){const a=document.createElement("a");a.href=SITE.repo;a.target="_blank";a.rel="noopener";a.textContent="GitHub";fo.appendChild(a)}
  if(claimU)$("dlgWho").textContent=claimU[lang][0]+" · "+claimU[lang][1];
  if(cur)cur.labs.forEach(l=>l.el.textContent=bname(l.b));
  followText();
}

/* ---------- loop ---------- */
let last=performance.now(),cw=0,ch=0,nearT=0;
function place(el,v,cam,show){if(!show){el.style.visibility="hidden";return}v3.copy(v).project(cam);if(v3.z>1||Math.abs(v3.x)>1.1||Math.abs(v3.y)>1.1){el.style.visibility="hidden";return}
  el.style.visibility="visible";el.style.transform="translate(-50%,-130%) translate("+((v3.x+1)/2*cw).toFixed(1)+"px,"+((1-v3.y)/2*ch).toFixed(1)+"px)"}
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(w!==cw||h!==ch){cw=w;ch=h;renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.setSize(w,h,false);gCam.aspect=cCam.aspect=w/h;gCam.updateProjectionMatrix();cCam.updateProjectionMatrix()}
  if(view==="globe"){
    if(spin)globe.rotation.y+=dt*0.05;
    if(tgt){let dy=tgt.y-globe.rotation.y;dy=Math.atan2(Math.sin(dy),Math.cos(dy));const dx=tgt.x-globe.rotation.x,k=reduceMotion?1:Math.min(1,dt*5);globe.rotation.y+=dy*k;globe.rotation.x+=dx*k;if(Math.abs(dy)+Math.abs(dx)<0.002)tgt=null}
    globe.updateMatrixWorld();
    const vis=[];
    UNIS.forEach(u=>{u.w=u.w||new THREE.Vector3();u.w.copy(u.pos).applyMatrix4(globe.matrixWorld);v3.copy(u.w).normalize();const facing=v3.dot(camDir.copy(gCam.position).sub(u.w).normalize())>0.15;
      u.show=false;u.el.className="lab"+(u===sel?" sel":u.open?" open":"");
      if(facing){v3.copy(u.w).project(gCam);u.sc=Math.hypot(v3.x,v3.y);if(u===sel)u.show=true;else if(u.sc<0.55)vis.push(u)}});
    vis.sort((a,b)=>(b.open?1:0)-(a.open?1:0)||a.sc-b.sc).slice(0,8).forEach(u=>u.show=true);
    UNIS.forEach(u=>place(u.el,u.w,gCam,u.show));
    renderer.render(gScene,gCam);
  }else if(cur){
    campusFrame(dt,now);
  }
}
setMode("walk");
(function(){const h=readHash();setView(h?"campus":"globe",h)})();
if(renderer)requestAnimationFrame(frame);
</script>
