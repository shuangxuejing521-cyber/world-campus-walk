name: "认领校园 · 캠퍼스 맡기 · Claim a campus"
description: "Tell us which campus your team wants to build. 告诉我们你们想建哪所校园。"
title: "[Claim] "
labels: ["claim"]
body:
  - type: markdown
    attributes:
      value: |
        After you submit this form we generate a walkable white-box model of your campus from OpenStreetMap and reply here with the files.
        提交后，我们会用 OpenStreetMap 数据生成白模，并在这里回复文件。
        제출하시면 OpenStreetMap 데이터로 화이트 모델을 만들어 여기에 답글로 보내 드립니다.
  - type: input
    id: university
    attributes:
      label: "University and campus · 学校与校区 · 대학과 캠퍼스"
      placeholder: "e.g. University of Bologna, main campus"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: "City and country, or a map link · 城市与国家，或地图链接"
      placeholder: "e.g. Bologna, Italy / https://www.openstreetmap.org/..."
    validations:
      required: true
  - type: input
    id: team
    attributes:
      label: "Team name · 团队名称 · 팀 이름"
      description: "A club, a class or just your own name."
    validations:
      required: true
  - type: textarea
    id: members
    attributes:
      label: "Names to credit · 署名 · 표기할 이름"
      description: "One per line, exactly as they should appear on the campus page."
    validations:
      required: true
  - type: dropdown
    id: relation
    attributes:
      label: "Your link to this university · 你与该校的关系"
      options:
        - "Current student · 在读学生"
        - "Staff or faculty · 教职员"
        - "Alumni · 校友"
        - "Other · 其他"
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: "How you plan to build it (optional) · 打算用什么方式建（选填） · 제작 방식 (선택)"
      description: "Any method is welcome: Blender, SketchUp, scanning, Minecraft, Unity, AI tools..."
  - type: dropdown
    id: start
    attributes:
      label: "Starting point · 起点 · 시작점"
      options:
        - "Send us an OpenStreetMap white-box · 给我们一份白模"
        - "We start from scratch · 我们从零开始"
  - type: dropdown
    id: licence
    attributes:
      label: "Public licence you plan to use · 打算采用的对公众许可 · 공개 이용 허락"
      description: "You keep the copyright either way. You can change this before submitting. See RIGHTS.md."
      options:
        - "Display only, all rights reserved (default) · 仅展示，保留所有权利（默认） · 게시만, 모든 권리 보유(기본값)"
        - "CC BY-NC 4.0"
        - "CC BY 4.0"
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: "Contact email (optional) · 联系邮箱（选填） · 연락 이메일 (선택)"
      description: "Only used to contact you about this campus. Not shown on the site. 只用于联系你，不会显示在网站上。"
  - type: checkboxes
    id: agree
    attributes:
      label: "Agreement · 确认 · 확인"
      options:
        - label: "We have read CONTRIBUTING.md and RIGHTS.md. 我们已阅读投稿指南和权利与许可说明。 CONTRIBUTING.md와 RIGHTS.md를 읽었습니다."
          required: true
        - label: "We will check our university's intellectual property policy, and get our department's consent if the work is coursework, supervised, or uses university resources. 我们会核对本校的知识产权规定；属于课程作业、有老师指导或使用学校资源的，会先取得院系同意。 학교의 지식재산권 규정을 확인하고, 수업 과제·지도 작업·학교 자원 사용 시 학과 동의를 받겠습니다."
          required: true
